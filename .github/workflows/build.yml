name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'presets/**', 'backend/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          CORE="${NAME%%-*}"
          IFS='.' read -r MA MI PA <<< "$CORE"
          CODE=$(( ${MA:-0} * 1000000 + ${MI:-0} * 10000 + ${PA:-0} * 100 ))
          if [[ "$NAME" == *-* ]]; then
            N=$(echo "$NAME" | grep -oE '[0-9]+$' || echo 1)
            CODE=$(( CODE - 100 + ${N:-1} ))
          else
            CODE=$(( CODE + 99 ))
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then CODE=$GITHUB_RUN_NUMBER; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [[ "$NAME" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Keystore
        env:
          KS: ${{ secrets.GT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          GT_KEYSTORE_PASSWORD: ${{ secrets.GT_KEYSTORE_PASSWORD }}
          GT_KEY_ALIAS: ${{ secrets.GT_KEY_ALIAS }}
          GT_KEY_PASSWORD: ${{ secrets.GT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          V=${{ steps.ver.outputs.name }}
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            abi=${b#app-}
            abi=${abi%-release}
            abi=${abi%-unsigned}
            cp "$f" "dist/GT-Unblock-$V-$abi.apk"
          done
          ls -la dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GT-Unblock-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=${{ steps.ver.outputs.name }}
          awk -v v="## $V" 'BEGIN{p=0} $0==v{p=1;next} /^## /{if(p)exit} p{print}' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "GT Unblock $V" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: GT Unblock ${{ steps.ver.outputs.name }}
          body_path: notes.md
          prerelease: ${{ steps.ver.outputs.pre }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'Y*', '2[0-9].*']
    paths-ignore: ['**.md', 'presets/**', 'backend/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME=$(python3 tools/version.py next dev)
          fi
          python3 tools/version.py "$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; fi
          python3 tools/version.py "$NAME"

      - name: Keystore
        env:
          KS: ${{ secrets.GT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          GT_KEYSTORE_PASSWORD: ${{ secrets.GT_KEYSTORE_PASSWORD }}
          GT_KEY_ALIAS: ${{ secrets.GT_KEY_ALIAS }}
          GT_KEY_PASSWORD: ${{ secrets.GT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease "-PversionName=${{ steps.ver.outputs.version }}" -PversionCode=${{ steps.ver.outputs.code }} "-Pcodename=${{ steps.ver.outputs.codename }}" "-PreleaseTag=${{ steps.ver.outputs.name }}" "-PreleaseYear=${{ steps.ver.outputs.year }}" "-PglydeDisplay=${{ steps.ver.outputs.display }}" "-Pring=${{ steps.ver.outputs.ring }}"

      - name: Collect APKs
        run: |
          mkdir -p dist
          V=${{ steps.ver.outputs.version }}
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            abi=${b#app-}
            abi=${abi%-release}
            abi=${abi%-unsigned}
            cp "$f" "dist/Glyde-$V-$abi.apk"
          done
          ls -la dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Glyde-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 tools/version.py "${{ steps.ver.outputs.name }}" notes > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ steps.ver.outputs.display }}
          body_path: notes.md
          prerelease: ${{ steps.ver.outputs.pre }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Static update mirror
        if: startsWith(github.ref, 'refs/tags/') && steps.ver.outputs.pre == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.name }}
          python3 tools/mirror.py "$V" dist > update.json
          cat update.json
          git config user.name "Glyde CI"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin gh-pages || true
          git worktree add -B gh-pages pages origin/gh-pages 2>/dev/null || { git worktree add --detach pages; cd pages; git checkout --orphan gh-pages; git rm -rf . > /dev/null 2>&1 || true; cd ..; }
          cp update.json pages/update.json
          if [ -d site ]; then cp -r site/. pages/; fi
          touch pages/.nojekyll
          cd pages
          git add -A
          git commit -m "Mirror $V" || true
          git push origin gh-pages
